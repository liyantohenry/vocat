# Devices Configuration for the CyberAI EchoEar clone
# Differences from esp_vocat_board_v1_2: no audio/LCD power-control GPIOs (those rails are
# not switched by the app on this board), no SD card, no green LED, LCD reset pin unknown
# (software reset only), touch interrupt pin unknown (touch is polled).
devices:
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 0  # 0-100, default 0 percent
    peripherals:
      - name: ledc_backlight               # LEDC peripheral for GPIO 3

  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      # DAC channel mask, 1-enable, 0-disable, layout: left,right
      dac_channel_mask: "1"            # Left, Right enable
      mclk_enabled: true

    # Power amplifier configuration
    peripherals:
      - name: gpio_pa_control
        gain: 6                          # dB
        active_level: 1                  # 0-low, 1-high

      # I2S interface configuration
      - name: i2s_audio_out
      # I2C interface configuration
      - name: i2c_master
        address: 0x30
        frequency: 400000                # Hz

  # Audio ADC Configuration (ES7210)
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 4
      # The channel mask, 1-enable, 0-disable
      # e.g."0111", bit0: Mic0 enable, bit1: Mic1 enable, bit2: Mic2 enable, bit3: Mic3 enable, bit4: Mic4 disable
      adc_channel_mask: "0111"         # Mic0, Mic1, Mic2 enable
      adc_channel_labels: ['NA', 'RE', 'FR', 'FL'] # MSB ~ LSB
      adc_init_gain: 0                 # dB

    peripherals:
      # I2S interface configuration
      - name: i2s_audio_in
      # I2C interface configuration
      - name: i2c_master
        address: 0x80
        frequency: 400000                # Hz

  # LCD Display Configuration
  - name: display_lcd
    chip: st77916
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_st77916: "*"
    config:
      x_max: 360
      y_max: 360
      need_reset: true                    # no reset GPIO known: use the panel's software reset
      # esp_lcd_panel_io_spi_config_t fields
      io_spi_config:
        cs_gpio_num: 10                   # GPIO10 - LCD_CS (FSPICS0)
        dc_gpio_num: -1                   # not used in QSPI mode
        spi_mode: 0                       # Traditional SPI mode (0~3)
        lcd_cmd_bits: 32                  # Bit-width of LCD command
        flags:
          quad_mode: true                 # Quad mode (4 data lines) - ST77916 uses quad mode

      lcd_panel_config:
        reset_gpio_num: -1
        # ST77916 specific configuration
        vendor_config: NULL

    peripherals:
    - name: spi_display                  # SPI peripheral for LCD communication

  # Touch Panel Configuration
  - name: lcd_touch
    chip: cst816s
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      # esp_lcd_touch_config_t fields for touch configuration
      touch_config:
        x_max: 360                        # Maximum X coordinate
        y_max: 360                        # Maximum Y coordinate
        int_gpio_num: -1                  # Interrupt pin unknown; the app polls touch every 15 ms
    peripherals:
      - name: i2c_master                   # I2C peripheral for touch communication
        i2c_addr: [0x2A]                   # CST816S 8-bit I2C address, from 7-bit 0x15
